<style>
:root{--bg:#000;--fg:#fff}

#cross{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px;border:1px solid var(--fg);border-radius:50%;pointer-events:none}
#hud{position:fixed;left:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));font-size:17px;letter-spacing:2px;pointer-events:none;text-shadow:0 0 6px #fff}
#menu{position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;padding:20px;overflow-y:auto}
#menu h1{font-size:clamp(48px,12vw,110px);letter-spacing:.3em;margin:0 0 .2em .3em;text-shadow:0 0 18px #fff}
#menu p{margin:4px;font-size:18px;letter-spacing:2px;opacity:.85}
#mmsg{white-space:pre-line;max-width:680px;line-height:1.5}
#hint{position:fixed;left:50%;bottom:18%;transform:translateX(-50%);width:90%;font-size:24px;letter-spacing:3px;text-align:center;text-shadow:0 0 8px #fff;pointer-events:none}
#mlist{display:grid;grid-template-columns:1fr;gap:10px;margin-top:14px}
@media(max-width:700px){#mlist{grid-template-columns:1fr}}
#mlist.sel{grid-template-columns:1fr 1fr}
@media(max-width:700px){#mlist.sel{grid-template-columns:1fr}}
#mlist button{background:none;border:1px solid var(--fg);color:var(--fg);font:inherit;font-size:20px;letter-spacing:3px;padding:12px 28px;cursor:pointer;white-space:pre}
#mlist button:hover{background:var(--fg);color:var(--bg)}
#credit{position:absolute;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));text-align:center;font-size:12px;letter-spacing:3px;opacity:.5;pointer-events:none}
#hurt{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,rgba(255,0,0,0) 40%,rgba(255,40,40,.9) 100%)}
#hpw{position:fixed;left:16px;bottom:calc(44px + env(safe-area-inset-bottom,0px));width:180px;height:7px;border:1px solid var(--fg);display:none;pointer-events:none}
#hpb{display:block;height:100%;width:100%;background:var(--fg)}
#alarm{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,rgba(255,40,30,0) 35%,rgba(255,40,30,.85) 100%)}
#exh{position:fixed;top:calc(104px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);text-align:center;display:none;pointer-events:none;color:#4dffb0;text-shadow:0 0 8px #4dffb0}
#exh svg{display:block;margin:0 auto}
#exd{font-size:20px;letter-spacing:3px;margin-top:2px}
#timer{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);font-size:50px;letter-spacing:3px;text-shadow:0 0 10px #fff;pointer-events:none;text-align:center}
#timer small{display:block;font-size:16px;letter-spacing:4px;opacity:.8}
</style></head><body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const cv=document.getElementById('c'),gl=document.getElementById('glow'),gx=gl.getContext('2d');
const R=new THREE.WebGLRenderer({canvas:cv,antialias:true,preserveDrawingBuffer:true});
const S=new THREE.Scene();S.background=new THREE.Color(0);
const cam=new THREE.PerspectiveCamera(80,1,0.05,200);S.add(cam);
function resize(){R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();gl.width=innerWidth>>2;gl.height=innerHeight>>2}
addEventListener('resize',resize);resize();

const solidMat=new THREE.MeshBasicMaterial({color:0,polygonOffset:true,polygonOffsetFactor:1,polygonOffsetUnits:1});
const lineMat=new THREE.LineBasicMaterial({color:0xffffff});
function wire(geo,mat){const g=new THREE.Group();g.add(new THREE.Mesh(geo,mat||solidMat));g.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo,20),lineMat));return g}

// level: [cx,baseY,cz,w,h,d]
const boxes=[[0,-1,0,80,1,80],
[0,0,-40,80,10,1],[0,0,40,80,10,1],[-40,0,0,1,10,80],[40,0,0,1,10,80],
[-8,0,-10,4,1.2,4],[-8,0,-10,2,2.4,2],[10,0,-6,6,1,6],[10,0,-6,3,2,3],
[0,0,8,2,6,2],[-14,0,10,2,6,2],[14,0,14,2,6,2],
[-20,0,-24,14,1.2,2],[20,0,-26,14,1.5,2],[0,0,-20,10,3,1],
[24,0,4,5,0.9,5],[-26,0,-4,5,1.8,5],[-30,0,18,8,3.2,3],[28,0,-12,3,1,3],[31,0,-12,3,2,3]];
const solids=[];
for(const [x,y,z,w,h,d] of boxes){const m=wire(new THREE.BoxGeometry(w,h,d));m.position.set(x,y+h/2,z);S.add(m);
solids.push({x0:x-w/2,x1:x+w/2,y0:y,y1:y+h,z0:z-d/2,z1:z+d/2,obj:m.children[0]})}
const grid=new THREE.GridHelper(80,40,0x444444,0x444444);grid.position.y=.01;S.add(grid);

// targets
const targets=[];
const artMat=new THREE.LineBasicMaterial({color:0xb14dff});
function mkTarget(x,y,z){const g=new THREE.Group();const og=new THREE.OctahedronGeometry(.7);g.add(new THREE.Mesh(og,solidMat));g.add(new THREE.LineSegments(new THREE.EdgesGeometry(og,20),artMat));g.position.set(x,y,z);g.userData={base:y,alive:true,t:0};S.add(g);targets.push(g)}

const tObjs=()=>targets.filter(t=>t.userData.alive).map(t=>t.children[0]);

// gun
const gun=new THREE.Group();
const ears=(x0,x1,y0,y1,dx)=>[-dx,dx].map(d=>[[[x0,y0],[x0,y1],[x1,y1],[x1+.01,y0]],.008,d]);
const cyl=(r,l,x)=>{const g=new THREE.CylinderGeometry(r,r,l,12);g.rotateX(Math.PI/2);g.translate(0,0,-x);return wire(g)};
const prof=(pts,w,dx=0)=>{const g=new THREE.ExtrudeGeometry(new THREE.Shape(pts.map(p=>new THREE.Vector2(p[0],p[1]))),{depth:w,bevelEnabled:false});g.translate(0,0,-w/2);g.rotateY(Math.PI/2);g.translate(dx,0,0);return wire(g)};
const rifleParts=[[[[-.3,.05],[0,.08],[.38,.08],[.42,.05],[.42,-.04],[.18,-.05],[.12,-.12],[.02,-.12],[0,-.06],[-.18,-.1],[-.3,-.08]],.07],
[[[-.02,.08],[.02,.13],[.2,.13],[.25,.08]],.025],
[[[.42,.055],[.64,.045],[.64,-.035],[.42,-.045]],.055],
[[[.64,.02],[.86,.02],[.86,0],[.64,0]],.022],
[[[.86,.035],[.92,.035],[.92,-.015],[.86,-.015]],.035],
[[[.74,.02],[.76,.14],[.78,.02]],.012],
[[[.02,-.12],[.12,-.12],[.15,-.27],[.05,-.28]],.05],
[[[.2,-.05],[.28,-.05],[.25,-.21],[.18,-.2]],.045],
[[[.3,-.04],[.4,-.04],[.4,-.075],[.32,-.075]],.03],
[[[-.33,.05],[-.3,.05],[-.3,-.08],[-.33,-.075]],.06],[[[.1,.08],[.1,.095],[.2,.095],[.2,.08]],.075],[[[.22,.08],[.22,.1],[.28,.1],[.28,.08]],.015,.05],
[[[.5,-.045],[.56,-.045],[.54,-.14],[.48,-.14]],.03],[[[.56,.05],[.6,.075],[.64,.075],[.64,.05]],.03],[[[.92,.03],[.97,.03],[.97,0],[.92,0]],.028],
...[0,1,2,3,4].map(i=>[[[.03+i*.04,.13],[.03+i*.04,.137],[.05+i*.04,.137],[.055+i*.04,.13]],.02]),...ears(0,.03,.08,.15,.03)];
const pistolParts=[[[[-.08,.06],[.22,.06],[.22,-.01],[-.08,-.01]],.035],[[[-.04,-.01],[.2,-.01],[.2,-.035],[.05,-.035],[-.04,-.03]],.03],[[[-.08,-.01],[-.02,-.01],[.02,-.16],[-.05,-.16]],.035],[[[0,-.035],[.1,-.035],[.1,-.05],[.02,-.05]],.01],[[[.22,.045],[.25,.045],[.25,.005],[.22,.005]],.02],[[[.19,.06],[.2,.085],[.22,.085],[.22,.06]],.01],[[[-.06,-.16],[.03,-.16],[.03,-.175],[-.06,-.175]],.04],...ears(-.08,-.05,.06,.085,.014)];
const launcherParts=[cyl(.07,1.1,.25),cyl(.09,.1,.78),cyl(.09,.1,-.28),cyl(.08,.05,.25),(()=>{const g=new THREE.ConeGeometry(.055,.2,10);g.rotateX(-Math.PI/2);g.translate(0,0,-.9);return wire(g)})(),[[[.15,-.07],[.22,-.07],[.2,-.22],[.13,-.22]],.04],[[[.4,-.07],[.46,-.07],[.45,-.2],[.39,-.2]],.035],[[[.1,-.07],[.2,-.07],[.2,-.09],[.1,-.09]],.02],[[[.58,.07],[.6,.17],[.62,.07]],.01],...ears(-.12,-.09,.07,.17,.022)];
const hammerParts=[cyl(.04,.9,.25),(()=>{const g=new THREE.BoxGeometry(.34,.22,.22);g.translate(0,0,-.25);return wire(g)})()];
const W=[{name:'RIFLE',parts:rifleParts,auto:true,cd:.09,hip:[.2,-.2,-.35],ads:[0,-.113,-.2],fovK:.32},
{name:'PISTOL',parts:pistolParts,auto:false,cd:.15,hip:[.17,-.17,-.32],ads:[0,-.068,-.25],fovK:.2},
{name:'LAUNCHER',parts:launcherParts,auto:false,cd:.9,rocket:true,hip:[.22,-.22,-.3],ads:[0,-.136,-.15],fovK:.15},
{name:'HAMMER',parts:hammerParts,auto:false,cd:.5,hammer:true,hip:[.2,-.22,-.3],ads:[.2,-.22,-.3],fovK:0}];
let cur=0;
W.forEach((w,i)=>{w.g=new THREE.Group();w.parts.forEach(p=>w.g.add(p.isObject3D?p:prof(...p)));gun.add(w.g);w.g.visible=i===0});
gun.traverse(o=>o.renderOrder=999);
function swap(i,f){if(lockW()!=null&&!f)return;i=i===undefined?(cur+1)%W.length:i;if(!W[i])return;cur=i;W.forEach((w,j)=>w.g.visible=j===i);gunHip.set(...W[i].hip);gunAds.set(...W[i].ads);gun.position.y-=.3;adsOn=false;firing=false;sfx('swap')}
const rockets=[],fx=[];
function rocket(){sfx('rocket');kick(.12);P.recoil+=.04;gun.position.z+=.2;const d=new THREE.Vector3();cam.getWorldDirection(d);const m=cyl(.05,.4,0);m.position.copy(cam.position).addScaledVector(d,.9);m.lookAt(m.position.clone().add(d));S.add(m);rockets.push({m,v:d.multiplyScalar(40),life:4})}
function boom(p,hm){kick(hm?.6:.45);sfx('boom');const R=hm?4.5:7,c=new THREE.Vector3(P.pos.x,P.pos.y+P.h*.5,P.pos.z),dv=c.clone().sub(p),dist=dv.length();
 if(dist<R){const f=1-dist/R;dv.y+=.5;dv.normalize();P.vel.addScaledVector(dv,(hm?24:22)*f);P.ground=false;P.slide=0;P.land=0}
 for(const t of targets)if(t.userData.alive&&t.position.distanceTo(p)<R*.7){t.userData.alive=false;t.userData.t=2.5;t.visible=false;hits++;burst(t.position)}
 for(const g of enemies)if(g.userData.alive&&Math.hypot(g.position.x-p.x,g.position.y+1-p.y,g.position.z-p.z)<R*.7+.5)killEnemy(g);
 if(boss&&boss.alive&&Math.hypot(boss.g.position.x-p.x,boss.g.position.y+2.5-p.y,boss.g.position.z-p.z)<R*.7+2)damageBoss(hm?30:25);
 const s=new THREE.LineSegments(new THREE.WireframeGeometry(new THREE.IcosahedronGeometry(1,1)),new THREE.LineBasicMaterial({color:0xffffff,transparent:true}));s.position.copy(p);s.life=.4;S.add(s);fx.push(s)}
function updFx(dt){
 for(let i=rockets.length-1;i>=0;i--){const r=rockets[i];r.life-=dt;let hit=r.life<=0;const n=Math.ceil(r.v.length()*dt/.4),st=r.v.clone().multiplyScalar(dt/n);
  for(let k=0;k<n&&!hit;k++){r.m.position.add(st);const p=r.m.position;
   if(solids.some(s=>p.x>s.x0&&p.x<s.x1&&p.y>s.y0&&p.y<s.y1&&p.z>s.z0&&p.z<s.z1)||targets.some(t=>t.userData.alive&&t.position.distanceTo(p)<.8)||enemies.some(e=>e.userData.alive&&Math.hypot(e.position.x-p.x,e.position.z-p.z)<.8&&p.y>e.position.y&&p.y<e.position.y+1.9)||(boss&&boss.alive&&Math.hypot(boss.g.position.x-p.x,boss.g.position.z-p.z)<1.5&&p.y>0&&p.y<5)){p.sub(st);hit=true}}
  if(hit){boom(r.m.position.clone());S.remove(r.m);rockets.splice(i,1)}}
 for(let i=fx.length-1;i>=0;i--){const s=fx[i];s.life-=dt;const u=1-s.life/.4;s.scale.setScalar(.5+u*6);s.material.opacity=Math.max(0,1-u);if(s.life<=0){S.remove(s);fx.splice(i,1)}}}
gun.children.forEach(c=>c.children.forEach(o=>o.renderOrder=999));
gun.scale.setScalar(.8);const gunHip=new THREE.Vector3(.2,-.2,-.35),gunAds=new THREE.Vector3(0,-.113,-.2),gunBase=gunHip.clone();let ads=0,adsOn=false;gun.position.copy(gunBase);cam.add(gun);

// player
const P={pos:new THREE.Vector3(0,0,30),vel:new THREE.Vector3(),yaw:0,pitch:0,ground:false,h:1.7,slide:0,eye:1.6,land:0,bob:0,recoil:0,roll:0};
const HW=.35,keys={};let hits=0,locked=false;
addEventListener('keydown',e=>{if(view==='intro'){if(!e.repeat)endIntro();return}if(e.code==='KeyR'&&view==='dead'&&!e.repeat){view='play';loadMission(mi);lockIn();return}keys[e.code]=true;if(e.code==='KeyR'&&locked)loadMission(mi);if(e.code==='KeyQ')swap();if(/^Digit[1-9]$/.test(e.code))swap(+e.code[5]-1);if(e.code==='Space')P.jumpBuf=.12;if(e.code==='KeyC'||e.code==='ControlLeft')P.slideReq=true;e.preventDefault&&locked&&e.preventDefault()});
addEventListener('keyup',e=>{keys[e.code]=false;if((e.code==='KeyC'||e.code==='ControlLeft')&&P.slide>0){P.slide=0;P.keep=.35;sfx('cancel')}if(e.code==='KeyC'||e.code==='ControlLeft')P.slideReq=false});
const menu=document.getElementById('menu');
menu.onclick=()=>{if(view==='intro'){endIntro();return}if(view==='ending'){if(endSkip)endSkip();return}if(view==='select'||view==='slots'||view==='diff')return;const b=document.querySelector('#mlist button');if(b)b.click()};
document.addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement===cv;menu.style.display=locked?'none':'flex';if(!locked&&(!mDone||doorObj)&&!dead&&view==='play'){view='pause';buildMenu()}});
addEventListener('mousemove',e=>{if(!locked)return;const k=.0022*(1-.45*ads);P.yaw-=e.movementX*k;P.pitch=Math.max(-1.5,Math.min(1.5,P.pitch-e.movementY*k))});
let firing=false,fireCd=0;
addEventListener('mousedown',e=>{if(!locked)return;if(e.button===0)firing=true;if(e.button===2)adsOn=true});addEventListener('mouseup',e=>{if(e.button===0)firing=false;if(e.button===2)adsOn=false});addEventListener('contextmenu',e=>e.preventDefault());

const tracers=[],ray=new THREE.Raycaster();
function smash(){gun.position.y-=.25;P.recoil+=.05;ray.setFromCamera({x:0,y:0},cam);const h=ray.intersectObjects(solids.map(s=>s.obj),false).filter(x=>x.distance<3.4);if(h.length)boom(h[0].point.clone(),true);else{sfx('cancel');kick(.05)}}
function shoot(){if(W[cur].rocket)return rocket();if(W[cur].hammer)return smash();sfx(W[cur].name==='PISTOL'?'pistol':'rifle');kick(.012);
 P.recoil=Math.min(P.recoil+.018,.09);P.pitch+=.006;P.yaw+=(Math.random()-.5)*.004;gun.position.z+=.06;
 ray.setFromCamera({x:0,y:0},cam);
 const hs=ray.intersectObjects([...solids.map(s=>s.obj),...tObjs(),...eMeshes(),...bMeshes()],false);
 const dir=ray.ray.direction.clone(),o=ray.ray.origin.clone();let end=o.clone().addScaledVector(dir,80);
 if(hs.length){end=hs[0].point;const t=targets.find(t=>t.children[0]===hs[0].object);if(t){t.userData.alive=false;t.userData.t=2.5;t.visible=false;hits++;burst(t.position)}else{const en=enemies.find(e=>e.userData.alive&&e.userData.meshes.includes(hs[0].object));if(en)killEnemy(en);else if(boss&&boss.alive&&boss.meshes.includes(hs[0].object))damageBoss(W[cur].name==='PISTOL'?5:2)}}
 const start=o.clone().addScaledVector(dir,.6).add(new THREE.Vector3(.2*(1-ads),-.15*(1-ads)-.02,0).applyQuaternion(cam.quaternion));
 const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints([start,end]),new THREE.LineBasicMaterial({color:0xffffff,transparent:true}));
 l.life=.08;S.add(l);tracers.push(l)}

function collide(axis){
 const hh=P.h;
 for(const s of solids){
  const px0=P.pos.x-HW,px1=P.pos.x+HW,pz0=P.pos.z-HW,pz1=P.pos.z+HW,py0=P.pos.y,py1=P.pos.y+hh;
  if(px1<=s.x0||px0>=s.x1||pz1<=s.z0||pz0>=s.z1||py1<=s.y0||py0>=s.y1)continue;
  if(axis==='y'){if(P.vel.y<=0){P.pos.y=s.y1;P.ground=true}else P.pos.y=s.y0-hh;P.vel.y=0}
  else if(axis==='x'){if(P.pos.y+.45>=s.y1&&P.ground){P.pos.y=s.y1;continue}P.pos.x=P.vel.x>0?s.x0-HW:s.x1+HW;P.vel.x*=.2}
  else{if(P.pos.y+.45>=s.y1&&P.ground){P.pos.y=s.y1;continue}P.pos.z=P.vel.z>0?s.z0-HW:s.z1+HW;P.vel.z*=.2}
 }}

const MS=[{n:'WARM UP',w:0,h:'SHOOT EVERY SHAPE. WASD TO MOVE, CLICK TO FIRE, RIGHT CLICK TO AIM.',b:[],t:[[-12,4,-2],[6,4,-16],[18,5,8],[-4,5,22],[-30,4,-16]]},
{n:'RISE',w:0,h:'SPACE TO JUMP. CLIMB THE STEPS TO REACH THE HOVERING SHAPES.',b:[[-30,0,34,5,1.2,5],[-24,0,34,5,2.4,5],[-18,0,34,5,3.6,5],[-12,0,34,5,4.8,5]],t:[[-30,2.4,34,1],[-24,3.6,34,1],[-18,4.8,34,1],[-12,6,34,1],[12,4,-22],[24,10,12]]},
{n:'DRIFT',w:0,h:'HOLD SHIFT TO SPRINT, THEN PRESS C TO SLIDE UNDER THE LOW GAP.',b:[[-22,0,25,1,6,6],[-22,0,33.5,1,6,5],[-22,1.1,29.5,1,4.9,3],[-29,0,22,14,6,1],[-29,0,36,14,6,1],[-36,0,29,1,6,14]],t:[[-31,3,25],[-31,3,33],[-26,4,29],[-33,5,29],[-10,4,6],[18,5,-18],[-24,5,-12],[26,5,24]]},
{n:'LEAP',w:0,h:'HOLD SHIFT TO SPRINT, THEN JUMP THE GAPS. THE HIGH SHAPES ARE UP THE STAIRS.',b:[[0,0,20,4,1,4],[0,0,13,4,2,4],[0,0,6,4,3,4],[0,0,-1,4,4,4],[0,0,-10,4,4,4],[-14,0,20,4,1,4],[-14,0,13,4,2,4],[-14,0,6,4,3,4],[14,0,20,4,1,4],[14,0,13,4,2,4],[14,0,6,4,3,4]],t:[[0,3,20,1],[0,4,13,1],[0,5,6,1],[0,6,-1,1],[0,6,-10,1],[-14,3,20,1],[-14,5,6,1],[14,3,20,1],[14,5,6,1],[-26,4,24],[26,4,24]]},
